services:
  portainer:
    container_name: portainer
    restart: "always"
    image: portainer/portainer
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /data/portainer_volume:/data
    ports:
      - 9090:9000
    command: -H unix:///var/run/docker.sock
  minio:
    container_name: "minio"
    restart: "always"
    image: minio/minio
    env_file:
      - /vagrant/config/env/minio.env
    volumes:
      - /data/S3:/data
    ports:
      - 9000:9000
    command: server /data
